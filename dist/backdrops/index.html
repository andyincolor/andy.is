<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Backdrop Lab — Andy Stone</title>
<meta name="description" content="Generated, analogue-feeling backgrounds drawn entirely in CSS. Randomize, tweak, export." />
<link rel="icon" href="/favicon.ico" />
<style>.bd{position:absolute;inset:0;overflow:hidden;container-type:size;isolation:isolate;pointer-events:none;z-index:0}
.bd--fixed{position:fixed}
.bd__img{position:absolute;inset:0}
.bd__stage{position:absolute;inset:0}
.bd__ground{position:absolute;inset:-15%}
.bd__s{position:absolute;width:0;height:0;will-change:transform}
.bd__shape,.bd__halo{position:absolute;left:0;top:0;will-change:filter}
.bd__leak{position:absolute;inset:0;mix-blend-mode:screen}
.bd__vig{position:absolute;inset:0;mix-blend-mode:multiply}
.bd__grain{position:absolute;left:0;top:0;width:140%;height:140%;mix-blend-mode:overlay;will-change:transform}
@keyframes bd-grain{0%{transform:translate(0,0)}12.5%{transform:translate(-9%,-14%)}25%{transform:translate(-21%,-4%)}37.5%{transform:translate(-6%,-23%)}50%{transform:translate(-25%,-19%)}62.5%{transform:translate(-14%,-9%)}75%{transform:translate(-3%,-27%)}87.5%{transform:translate(-19%,-26%)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.bd *{animation:none!important}}</style>
<style>
:root { color-scheme: dark; }
astro-dev-toolbar { display: none; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #111214; color: #e8e8ea; font: 13px/1.45 system-ui, -apple-system, sans-serif; }
button, input, select { font: inherit; color: inherit; }
.lab { display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
.lab__stage { display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
.lab__bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #26272b; background: #16171a; }
.lab__bar--bottom { border-bottom: 0; border-top: 1px solid #26272b; }
.lab__title { font-size: 14px; letter-spacing: -0.01em; margin-right: 8px; }
.lab__aspects { display: flex; gap: 2px; background: #0d0e10; padding: 2px; border-radius: 6px; }
.lab__aspects button { background: none; border: 0; padding: 4px 9px; border-radius: 4px; color: #9a9ba3; cursor: pointer; }
.lab__aspects button.is-on { background: #2b2d33; color: #fff; }
.lab__check { display: inline-flex; align-items: center; gap: 6px; color: #b9bac2; }
.lab__hint { margin-left: auto; color: #6f7079; font-size: 12px; }
.lab__spacer { flex: 1; }
.lab__viewport { display: grid; place-items: center; padding: 24px; min-height: 0; overflow: hidden; background: #0c0d0f; }
.lab__frame { position: relative; max-width: 100%; max-height: 100%; width: min(100%, calc((100vh - 140px) * var(--ar, 1.5))); box-shadow: 0 30px 80px rgba(0,0,0,0.6); overflow: hidden; border-radius: 3px; }
.lab__frame.is-fill { width: 100%; height: 100%; aspect-ratio: auto !important; }
.lab__preview { position: absolute; inset: 0; }
.lab__handles { position: absolute; inset: 0; pointer-events: none; }
.lab__handles.is-hidden { display: none; }
.lab__handle { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,0.35); box-shadow: 0 1px 6px rgba(0,0,0,0.5); pointer-events: auto; cursor: grab; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff; }
.lab__handle.is-selected { background: #2f9fff; border-color: #fff; }
.lab__handle:active { cursor: grabbing; }
.btn { background: #2b2d33; border: 1px solid #383a42; border-radius: 6px; padding: 6px 12px; cursor: pointer; color: #e8e8ea; }
.btn:hover { background: #34363e; }
.btn--primary { background: #2f9fff; border-color: #2f9fff; color: #fff; font-weight: 600; }
.btn--primary:hover { background: #4aabff; }
.btn--danger { color: #ff7b7b; }
.btn--sm { padding: 3px 8px; font-size: 12px; }
select, input[type=text], input[type=number] { background: #0d0e10; border: 1px solid #383a42; border-radius: 6px; padding: 6px 8px; color: #e8e8ea; }
.lab__panel { overflow-y: auto; border-left: 1px solid #26272b; background: #16171a; padding-bottom: 40px; }
.sec { border-bottom: 1px solid #26272b; padding: 12px 16px 14px; }
.sec__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sec__title { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #8b8c95; font-weight: 600; }
.row { display: grid; grid-template-columns: 92px 1fr 46px; align-items: center; gap: 8px; margin: 5px 0; }
.row label { color: #b9bac2; font-size: 12px; }
.row input[type=range] { width: 100%; accent-color: #2f9fff; }
.row output { text-align: right; font-variant-numeric: tabular-nums; color: #8b8c95; font-size: 11px; }
.row input[type=color] { width: 100%; height: 26px; padding: 0; border: 1px solid #383a42; border-radius: 6px; background: #0d0e10; }
.row select { width: 100%; }
.row--wide { grid-template-columns: 92px 1fr; }
.shape-list { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
.shape-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; background: #1d1e22; border: 1px solid transparent; cursor: pointer; }
.shape-row.is-selected { border-color: #2f9fff; }
.shape-row .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); }
.shape-row .nm { flex: 1; font-size: 12px; }
.shape-row .mini { background: none; border: 0; color: #8b8c95; cursor: pointer; padding: 0 3px; }
.shape-row .mini:hover { color: #fff; }
.btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
.name-row { display: flex; gap: 6px; }
.name-row input { flex: 1; }
.lab__toast { position: fixed; left: 50%; bottom: 70px; transform: translateX(-50%); background: #2f9fff; color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.lab__toast.is-error { background: #d9453d; }
.muted { color: #8b8c95; font-size: 12px; }
code { background: #0d0e10; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

</style>

<body>

  <div class="lab">
    <main class="lab__stage">
      <header class="lab__bar">
        <strong class="lab__title">Backdrop Lab</strong>
        <div class="lab__aspects" data-aspects>
          <button data-aspect="16/9">16:9</button>
          <button data-aspect="3/2" class="is-on">3:2</button>
          <button data-aspect="4/3">4:3</button>
          <button data-aspect="1/1">1:1</button>
          <button data-aspect="4/5">4:5</button>
          <button data-aspect="9/16">9:16</button>
          <button data-aspect="fill">Fill</button>
        </div>
        <label class="lab__check"><input type="checkbox" data-handles checked /> Handles</label>
        <label class="lab__check"><input type="checkbox" data-preview-motion checked /> Motion</label>
        <span class="lab__hint">Drag the dots to move shapes · R randomize · ⌘Z undo · ⌘S save</span>
      </header>
      <div class="lab__viewport">
        <div class="lab__frame" data-frame style="aspect-ratio: 3/2">
          <div class="lab__preview" data-preview></div>
          <div class="lab__handles" data-handle-layer></div>
        </div>
      </div>
      <footer class="lab__bar lab__bar--bottom">
        <button class="btn btn--primary" data-randomize>Randomize</button>
        <select data-palette title="Palette family for Randomize"></select>
        <button class="btn" data-reroll title="New seed, same palette and shape count">Re-roll</button>
        <span class="lab__spacer"></span>
        <button class="btn" data-undo title="Undo (⌘Z)">Undo</button>
        <button class="btn" data-redo title="Redo (⇧⌘Z)">Redo</button>
      </footer>
    </main>
    <aside class="lab__panel" data-panel></aside>
  </div>
  <div class="lab__toast" data-toast hidden></div>
