    derive(pw).then(function(raw){return open(raw).then(function(html){try{localStorage.setItem(K,toB64(raw))}catch(e){}show(html)})})
    .catch(function(){err.textContent="That password didn't work. Try again.";go.disabled=false;go.textContent='Open';document.getElementById('pw').select()});
  });
})();
