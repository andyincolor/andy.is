:root{--bg:#f7f7f4;--surface:#ffffff;--ink:#16181b;--ink-2:#464b52;--ink-3:#767b82;--line:#c9ccc5;--accent:#2747c9;--warn:#a8401b;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--head);-webkit-font-smoothing:antialiased;

p{color:var(--ink-2);margin:0 0 28px}

.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;font-size:17px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}

input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-size:14.5px;margin:10px 0 0;min-height:1.5em}
.small{font-size:13.5px;color:var(--ink-3);margin-top:24px}
.wait main{visibility:hidden}
