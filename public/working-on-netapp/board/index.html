    .then(function(pt){return new TextDecoder().decode(pt)})}
  function swap(html){document.open();document.write(html);document.close()}
  function show(html){if(document.readyState==='complete'){setTimeout(function(){swap(html)},0)}else{window.addEventListener('load',function(){setTimeout(function(){swap(html)},0)})}}
  function ready(){document.documentElement.className=''}
  var f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
  var cached=null;try{cached=localStorage.getItem(K)}catch(e){}
  if(cached){open(b64(cached)).then(show,function(){try{localStorage.removeItem(K)}catch(e){}ready()})}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();err.textContent='';go.disabled=true;go.textContent='Opening';
    var pw=document.getElementById('pw').value.trim().toLowerCase();
    derive(pw).then(function(raw){return open(raw).then(function(html){try{localStorage.setItem(K,toB64(raw))}catch(e){}show(html)})})
    .catch(function(){err.textContent="That password didn't work. Try again.";go.disabled=false;go.textContent='Open';document.getElementById('pw').select()});
  });
})();
</script>
</body>
